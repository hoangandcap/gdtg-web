<b>3.</b> Khi đang giao dịch bị kích ra hoặc trung gian bị kích, lập tức liên hệ riêng với trung gian.
    </div>

    <div class="rule">
      <b>4.</b> Mua bán gì phải ghi rõ nội dung cần giao dịch. Không ghi nội dung hoặc không có box sẽ không giải quyết.
    </div>
  </div>


  <div class="card">
    <h2>🔎 Tra cứu giao dịch</h2>

    <label>Mã giao dịch</label>
    <input id="lookup" placeholder="Ví dụ: GD123456">

    <button onclick="lookupTransaction()">
      Tra cứu
    </button>

    <div class="result" id="lookupResult"></div>
  </div>

</div>

<footer>
  © 2026 GDTG — Giao Dịch Trung Gian
</footer>


<script>

function createTransaction() {

  const buyer = document.getElementById("buyer").value.trim();
  const seller = document.getElementById("seller").value.trim();
  const money = document.getElementById("money").value.trim();
  const content = document.getElementById("content").value.trim();

  if (!buyer || !seller || !money || !content) {
    alert("Vui lòng nhập đầy đủ thông tin!");
    return;
  }

  const code =
    "GD" + Math.floor(100000 + Math.random() * 900000);

  const transaction = {
    code: code,
    buyer: buyer,
    seller: seller,
    money: money,
    content: content,
    status: "Đang chờ giao dịch"
  };

  localStorage.setItem(
    "gdtg_" + code,
    JSON.stringify(transaction)
  );

  document.getElementById("result").style.display = "block";

  document.getElementById("transactionCode").innerText =
    code;

  document.getElementById("transactionInfo").innerHTML =
    "Người mua: " + buyer +
    "<br>Người bán: " + seller +
    "<br>Số tiền: " +
    Number(money).toLocaleString("vi-VN") +
    " VNĐ" +
    "<br>Nội dung: " + content +
    "<br>Trạng thái: Đang chờ giao dịch";
}


function lookupTransaction() {

  const code =
    document.getElementById("lookup").value.trim().toUpperCase();

  const result =
    document.getElementById("lookupResult");

  if (!code) {
    alert("Nhập mã giao dịch trước!");
    return;
  }

  const data =
    localStorage.getItem("gdtg_" + code);

  result.style.display = "block";

  if (!data) {
    result.innerHTML =
      "❌ Không tìm thấy giao dịch với mã <b>" +
      code +
      "</b>.";
    return;
  }

  const transaction = JSON.parse(data);

  result.innerHTML =
    "<b>Mã giao dịch:</b> " + transaction.code +
    "<br><b>Người mua:</b> " + transaction.buyer +
    "<br><b>Người bán:</b> " + transaction.seller +
    "<br><b>Số tiền:</b> " +
    Number(transaction.money).toLocaleString("vi-VN") +
    " VNĐ" +
    "<br><b>Nội dung:</b> " + transaction.content +
    "<br><b>Trạng thái:</b> " + transaction.status;
}

</script>

</body>
</html>
